name: M0 native companion

on:
  push:
    branches: [web-port-plan]
  pull_request:
    paths:
      - 'companion/**'
      - 'packaging/**'
      - 'protocol/**'
      - 'scripts/**'
      - 'toolchains/**'
      - 'tests/**'
      - 'web/**'
      - 'vwb.py'
      - 'pyproject.toml'
      - '.github/workflows/m0.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x86_64, runner: ubuntu-24.04}
          - {target: linux-arm64, runner: ubuntu-24.04-arm}
          - {target: windows-x86_64, runner: windows-2025}
          - {target: windows-arm64, runner: windows-11-arm}
          - {target: macos-arm64, runner: macos-15}
          - {target: macos-x86_64, runner: macos-15-intel}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CLI completion dependency in the selected Python
        run: python -m pip install "argcomplete>=3,<5"
      - name: Companion, process, protocol, packaging and LSP unit checks
        run: python -m unittest discover -s tests -v
      - name: Existing VWB regression checks
        run: python -m unittest discover -s examples/test -p "test_vwb*.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser client protocol checks
        run: node --test tests/test_web_client.mjs
      - name: Build pinned self-contained native bundle
        run: python scripts/build_native_bundle.py --target ${{ matrix.target }} --output-dir dist --download-runtime --archive
      - name: Exercise native bundle with local project
        run: python scripts/smoke_native_bundle.py dist/vwb-companion-${{ matrix.target }} --output .m0-evidence/native-${{ matrix.target }}.json
      - name: Record available tool capabilities without claiming workflow passes
        run: python scripts/probe_toolchain.py --output .m0-evidence/discovery-${{ matrix.target }}.json
      - name: Upload evidence and native runtime packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-${{ matrix.target }}
          include-hidden-files: true
          path: |
            .m0-evidence/*.json
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: warn
          retention-days: 14

  toolchains:
    name: Toolchain feasibility ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04}
          - {target: linux-arm64, runner: ubuntu-24.04-arm}
          - {target: windows-x64, runner: windows-2025}
          - {target: windows-arm64, runner: windows-11-arm}
          - {target: darwin-arm64, runner: macos-15}
          - {target: darwin-x64, runner: macos-15-intel}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ startsWith(matrix.target, 'windows-') && 'x64' || '' }}
      - name: Install declared native ARM64 Ubuntu GHDL prerequisite
        if: matrix.target == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl-llvm=4.1.0+dfsg-0ubuntu2 ghdl-common=4.1.0+dfsg-0ubuntu2
          /usr/bin/ghdl-llvm --version
          /usr/bin/ghdl-llvm --disp-config
      - name: Prove native Homebrew Tcl-enabled Yosys candidate on Apple Silicon
        if: matrix.target == 'darwin-arm64'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          candidate = json.loads(Path('toolchains/native-lock.json').read_text())['supplemental_candidates']['yosys-darwin-arm64-homebrew-tcl']
          subprocess.run(['brew', 'update'], check=True)
          formula = json.loads(subprocess.check_output(['brew', 'info', '--json=v2', 'yosys'], text=True))['formulae'][0]
          if formula['versions']['stable'] != candidate['version']:
              raise SystemExit('Homebrew Yosys version differs from the recorded candidate')
          bottle = formula['bottle']['stable']['files'][candidate['bottle_tag']]
          if bottle['sha256'] != candidate['bottle_sha256']:
              raise SystemExit('Homebrew Yosys bottle digest differs from the recorded candidate')
          subprocess.run(['brew', 'install', '--force-bottle', 'yosys'], check=True)
          prefix = Path(subprocess.check_output(['brew', '--prefix', 'yosys'], text=True).strip())
          binary = (prefix / 'bin' / 'yosys').resolve(strict=True)
          version = subprocess.check_output([str(binary), '-V'], text=True)
          print('Installed Yosys version output:', repr(version), flush=True)
          if not re.search(r'\b0\.70(?=[\s+(]|$)', version):
              raise SystemExit('Installed Yosys is not the guarded version 0.70')
          with tempfile.TemporaryDirectory() as temporary:
              script = Path(temporary) / 'tcl-probe.tcl'
              script.write_text('yosys design -reset\nputs "VWB_TCL_READY"\n')
              result = subprocess.run([str(binary), '-Q', '-T', '-c', str(script)], text=True, capture_output=True, check=True)
              if 'VWB_TCL_READY' not in result.stdout:
                  raise SystemExit('Installed Yosys did not execute the real Tcl probe')
          override = Path('.m0-yosys-bin')
          override.mkdir()
          (override / 'yosys').symlink_to(binary)
          print(version.strip())
          print('Native Tcl Yosys candidate verified; only Yosys is exposed through the explicit override')
          PY
      - name: Acquire exact native package and run real HDL workflows
        run: python scripts/acquire_toolchain.py --target ${{ matrix.target }} --directory .m0-tools --output .m0-evidence/acquisition-${{ matrix.target }}.json --probe-output .m0-evidence/workflows-${{ matrix.target }}.json --probe-work-dir .m0-evidence/toolchain-logs --supplementals ${{ matrix.target == 'darwin-arm64' && format('--overlay-tool yosys={0}/.m0-yosys-bin/yosys', github.workspace) || '' }} ${{ matrix.target == 'linux-arm64' && '--external-ghdl /usr/bin/ghdl-llvm --ghdl-prefix /usr/lib/ghdl/llvm/vhdl' || '' }} ${{ startsWith(matrix.target, 'windows-') && format('--windows-cocotb-python "{0}/python.exe"', env.pythonLocation) || '' }}
      - name: Retain passes, missing workflows, failures and native logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-toolchains-${{ matrix.target }}
          include-hidden-files: true
          path: |
            .m0-evidence/**/*.json
            .m0-evidence/**/*.log
            .m0-evidence/**/status
          if-no-files-found: warn
          retention-days: 14

  arch-feasibility:
    name: Arch Linux userspace toolchain feasibility
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Prepare development test host
        run: pacman -Syu --noconfirm python git ca-certificates tar gzip gcc
      - uses: actions/checkout@v4
      - name: Acquire exact suite and execute real HDL workflows on Arch
        run: python scripts/acquire_toolchain.py --target linux-x64 --directory .m0-tools --output .m0-evidence/acquisition-arch-x64.json --probe-output .m0-evidence/workflows-arch-x64.json --probe-work-dir .m0-evidence/toolchain-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-toolchains-arch-userspace
          include-hidden-files: true
          path: |
            .m0-evidence/**/*.json
            .m0-evidence/**/*.log
            .m0-evidence/**/status
          if-no-files-found: warn
          retention-days: 14

  web-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test harness
        run: npm install --prefix .m0-browser --no-audit --no-fund playwright@1.62.1
      - name: Install browser
        run: .m0-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise the actual browser and native companion
        run: node scripts/probe_browser.mjs --playwright-module ../.m0-browser/node_modules/playwright --output browser-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-browser-evidence
          path: browser-evidence.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: m0-pages-source
          path: web/
          retention-days: 14
