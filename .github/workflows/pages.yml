name: VWB development preview on Pages

on:
  push:
    branches: [web-port-plan]
    paths:
      - 'web/**'
      - 'companion/**'
      - 'protocol/**'
      - 'vwb.py'
      - 'scripts/build_web.py'
      - 'scripts/probe_workspace.mjs'
      - 'scripts/probe_pages.mjs'
      - 'scripts/probe_editor_workspace.mjs'
      - 'scripts/probe_files_workspace.mjs'
      - 'scripts/probe_source_workspace.mjs'
      - 'scripts/probe_hdl_workspace.mjs'
      - 'scripts/browser_assets.mjs'
      - 'scripts/acquire_toolchain.py'
      - 'toolchains/**'
      - 'upstream/**'
      - 'scripts/acquire_upstream_hdl.py'
      - 'scripts/probe_upstream_hdl.py'
      - 'tests/test_upstream_hdl.py'
      - 'tests/test_acquire_upstream_hdl.py'
      - 'tests/test_verilator.py'
      - '.github/workflows/upstream-hdl.yml'
      - 'scripts/acquire_editor_tools.py'
      - 'editor-fixtures/**'
      - 'tests/test_editor.py'
      - 'tests/test_edits.py'
      - 'tests/test_companion_editor.py'
      - 'tests/test_files.py'
      - 'tests/test_companion_files.py'
      - 'tests/test_hdl.py'
      - 'tests/test_cocotb_runtime.py'
      - 'tests/test_runtime_compatibility.py'
      - 'tests/test_acquire_toolchain.py'
      - 'tests/test_acquire_editor_tools.py'
      - 'tests/test_web_build.py'
      - 'tests/test_*.mjs'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'companion/**'
      - 'protocol/**'
      - 'vwb.py'
      - 'scripts/build_web.py'
      - 'scripts/probe_workspace.mjs'
      - 'scripts/probe_pages.mjs'
      - 'scripts/probe_editor_workspace.mjs'
      - 'scripts/probe_files_workspace.mjs'
      - 'scripts/probe_source_workspace.mjs'
      - 'scripts/probe_hdl_workspace.mjs'
      - 'scripts/browser_assets.mjs'
      - 'scripts/acquire_toolchain.py'
      - 'toolchains/**'
      - 'upstream/**'
      - 'scripts/acquire_upstream_hdl.py'
      - 'scripts/probe_upstream_hdl.py'
      - 'tests/test_upstream_hdl.py'
      - 'tests/test_acquire_upstream_hdl.py'
      - 'tests/test_verilator.py'
      - '.github/workflows/upstream-hdl.yml'
      - 'scripts/acquire_editor_tools.py'
      - 'editor-fixtures/**'
      - 'tests/test_editor.py'
      - 'tests/test_edits.py'
      - 'tests/test_companion_editor.py'
      - 'tests/test_files.py'
      - 'tests/test_companion_files.py'
      - 'tests/test_hdl.py'
      - 'tests/test_cocotb_runtime.py'
      - 'tests/test_runtime_compatibility.py'
      - 'tests/test_acquire_toolchain.py'
      - 'tests/test_acquire_editor_tools.py'
      - 'tests/test_web_build.py'
      - 'tests/test_*.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upstream-hdl:
    uses: ./.github/workflows/upstream-hdl.yml

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Pages paths and repeatable static builds
        run: python -m unittest discover -s tests -p test_web_build.py -v
      - name: Check browser protocol and workspace models
        run: node --test tests/test_*.mjs
      - name: Check editor transport, HTTP boundaries and durable transactions
        run: |
          python -m unittest discover -s tests -p test_editor.py -v
          python -m unittest discover -s tests -p test_edits.py -v
          python -m unittest discover -s tests -p test_companion_editor.py -v
          python -m unittest discover -s tests -p test_acquire_editor_tools.py -v
          python -m unittest discover -s tests -p test_files.py -v
          python -m unittest discover -s tests -p test_companion_files.py -v
          python -m unittest discover -s tests -p test_hdl.py -v
          python -m unittest discover -s tests -p test_acquire_toolchain.py -v
      - name: Build validated development preview
        run: python scripts/build_web.py --output dist/web --base-path /verilog-workbench/
      - name: Install pinned browser acceptance harness
        run: npm install --prefix .web-browser --no-audit --no-fund playwright@1.62.1
      - name: Install Chromium
        run: .web-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Install native Icarus for real pass, failure and cancellation acceptance
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog ghdl
      - name: Acquire integrity-pinned Linux editor services for acceptance
        run: python scripts/acquire_editor_tools.py --directory .m0-tools/editor
      - name: Exercise real semantic editing and rename through the built browser UI
        run: node scripts/probe_editor_workspace.mjs --editor-config .m0-tools/editor/editor-config.json --playwright-module ../.web-browser/node_modules/playwright --output editor-browser-evidence.json --screenshot editor-workspace.png
      - name: Exercise built Pages paths with the real native companion
        run: node scripts/probe_workspace.mjs --playwright-module ../.web-browser/node_modules/playwright --native-sim true --output pages-browser-evidence.json --screenshot pages-workspace.png
      - name: Exercise file and folder management through the built browser UI
        run: node scripts/probe_files_workspace.mjs --playwright-module ../.web-browser/node_modules/playwright --output files-browser-evidence.json --screenshot files-workspace.png
      - name: Exercise syntax, native editing and literal search through the built browser UI
        run: node scripts/probe_source_workspace.mjs --playwright-module ../.web-browser/node_modules/playwright --output source-browser-evidence.json --screenshot source-workspace.png
      - name: Acquire pinned complete Linux HDL toolchain for browser acceptance
        run: python scripts/acquire_toolchain.py --target linux-x64 --directory .m0-tools/hdl --output hdl-tool-acquisition.json
      - name: Verify real Cocotb shutdown and failure controls
        env:
          VWB_COCOTB_RUNTIME_TEST_ACQUISITION: hdl-tool-acquisition.json
        run: python -m unittest discover -s tests -p test_cocotb_runtime.py -v
      - name: Execute complete HDL workflows through the built browser UI
        run: node scripts/probe_hdl_workspace.mjs --acquisition hdl-tool-acquisition.json --playwright-module ../.web-browser/node_modules/playwright --output hdl-browser-evidence.json --screenshot hdl-workspace.png
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-browser-evidence
          path: |
            pages-browser-evidence.json
            pages-workspace.png
            editor-browser-evidence.json
            editor-workspace.png
            files-browser-evidence.json
            files-workspace.png
            source-browser-evidence.json
            source-workspace.png
            hdl-tool-acquisition.json
            hdl-browser-evidence.json
            hdl-workspace.png
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: [build, upstream-hdl]
    if: github.ref == 'refs/heads/web-port-plan' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deploy

  verify-public:
    needs: deploy
    if: github.ref == 'refs/heads/web-port-plan' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned browser acceptance harness
        run: npm install --prefix .web-browser --no-audit --no-fund playwright@1.62.1
      - name: Install Chromium
        run: .web-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Acquire pinned editor services for public semantic acceptance
        run: python scripts/acquire_editor_tools.py --directory .m0-tools/editor
      - name: Verify actual HTTPS app with a native loopback companion
        env:
          VWB_PUBLIC_WORKSPACE: ${{ format('{0}workspace/', needs.deploy.outputs.page_url) }}
        run: node scripts/probe_pages.mjs --public-url "$VWB_PUBLIC_WORKSPACE" --playwright-module ../.web-browser/node_modules/playwright --output pages-public-evidence.json --screenshot pages-public-workspace.png
      - name: Verify semantic editing from the actual HTTPS app
        env:
          VWB_PUBLIC_WORKSPACE: ${{ format('{0}workspace/', needs.deploy.outputs.page_url) }}
        run: node scripts/probe_editor_workspace.mjs --public-url "$VWB_PUBLIC_WORKSPACE" --editor-config .m0-tools/editor/editor-config.json --playwright-module ../.web-browser/node_modules/playwright --output editor-public-evidence.json --screenshot editor-public-workspace.png
      - name: Verify file lifecycle from the actual HTTPS app
        env:
          VWB_PUBLIC_WORKSPACE: ${{ format('{0}workspace/', needs.deploy.outputs.page_url) }}
        run: node scripts/probe_files_workspace.mjs --public-url "$VWB_PUBLIC_WORKSPACE" --playwright-module ../.web-browser/node_modules/playwright --output files-public-evidence.json --screenshot files-public-workspace.png
      - name: Verify source editing from the actual HTTPS app
        env:
          VWB_PUBLIC_WORKSPACE: ${{ format('{0}workspace/', needs.deploy.outputs.page_url) }}
        run: node scripts/probe_source_workspace.mjs --public-url "$VWB_PUBLIC_WORKSPACE" --playwright-module ../.web-browser/node_modules/playwright --output source-public-evidence.json --screenshot source-public-workspace.png
      - name: Acquire pinned complete Linux HDL toolchain for public acceptance
        run: python scripts/acquire_toolchain.py --target linux-x64 --directory .m0-tools/hdl --output hdl-public-tool-acquisition.json
      - name: Execute complete HDL workflows from the actual HTTPS app
        env:
          VWB_PUBLIC_WORKSPACE: ${{ format('{0}workspace/', needs.deploy.outputs.page_url) }}
        run: node scripts/probe_hdl_workspace.mjs --public-url "$VWB_PUBLIC_WORKSPACE" --acquisition hdl-public-tool-acquisition.json --playwright-module ../.web-browser/node_modules/playwright --output hdl-public-evidence.json --screenshot hdl-public-workspace.png
      - name: Retain public HTTPS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-public-evidence
          path: |
            pages-public-evidence.json
            pages-public-workspace.png
            editor-public-evidence.json
            editor-public-workspace.png
            files-public-evidence.json
            files-public-workspace.png
            source-public-evidence.json
            source-public-workspace.png
            hdl-public-tool-acquisition.json
            hdl-public-evidence.json
            hdl-public-workspace.png
          if-no-files-found: warn
